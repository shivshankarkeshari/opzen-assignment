name: opzen-assignment

x-app: &app
  build: .
  image: opzen-assignment-app:local

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://opzen:opzen_local@postgres:5432/opzen
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: opzen
  MINIO_SECRET_KEY: opzen_local_storage
  MINIO_BUCKET: opzen-documents
  MINIO_SECURE: "false"
  DEMO_IDENTITIES: ${DEMO_IDENTITIES:-analyst:analyst-local-key,reviewer:reviewer-local-key}
  EMBEDDING_BACKEND: huggingface
  EMBEDDING_MODEL: BAAI/bge-base-en-v1.5
  EMBEDDING_REVISION: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  EMBEDDING_DIMENSIONS: "768"
  CHUNK_TOKENS: "450"
  HF_HOME: /root/.cache/huggingface
  DOCLING_ARTIFACTS_PATH: /root/.cache/docling/models
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Run scripts/configure_local.py first}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Run scripts/configure_local.py first}
  LANGFUSE_BASE_URL: http://langfuse:3000
  LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: openai/gpt-oss-120b
  LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
  AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-5}
  AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-180}

x-langfuse-environment: &langfuse-environment
  DATABASE_URL: postgresql://langfuse:langfuse_local@langfuse-postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3000
  SALT: ${LANGFUSE_SALT:?Run scripts/configure_local.py first}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Run scripts/configure_local.py first}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: langfuse_local
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: langfuse_local_redis
  REDIS_TLS_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: opzen
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: opzen_local_storage
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: opzen
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: opzen_local_storage
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: opzen
      POSTGRES_PASSWORD: opzen_local
      POSTGRES_DB: opzen
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opzen -d opzen"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio@sha256:634c989a2f1029162fc2676c263caa181213b9410449968532f750a6fb77532d
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: opzen
      MINIO_ROOT_PASSWORD: opzen_local_storage
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["minio-data:/data"]
  bootstrap:
    <<: *app
    command: python -m backend.bootstrap
    environment: *app-environment
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
  api:
    <<: *app
    environment: *app-environment
    volumes: ["model-cache:/root/.cache"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    command: python -m backend.worker
    environment: *app-environment
    volumes: ["model-cache:/root/.cache"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      langfuse: {condition: service_started}
  ui:
    <<: *app
    command: python -m streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      API_URL: http://api:8000
      DEMO_IDENTITIES: ${DEMO_IDENTITIES:-analyst:analyst-local-key,reviewer:reviewer-local-key}
      UI_DEMO_USER: analyst
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api: {condition: service_healthy}
  langfuse-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_local
      POSTGRES_DB: langfuse
    volumes: ["langfuse-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse_local
      CLICKHOUSE_DB: default
    volumes: ["clickhouse-data:/var/lib/clickhouse", "clickhouse-logs:/var/log/clickhouse-server"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7
    command: redis-server --requirepass langfuse_local_redis --maxmemory 256mb --maxmemory-policy noeviction
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuse_local_redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    environment: *langfuse-environment
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      langfuse-postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
  langfuse:
    image: docker.langfuse.com/langfuse/langfuse:4
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://langfuse:3000/api/public/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Run scripts/configure_local.py first}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:59000
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: opzen-local
      LANGFUSE_INIT_ORG_NAME: Opzen
      LANGFUSE_INIT_PROJECT_ID: opzen-documents
      LANGFUSE_INIT_PROJECT_NAME: Document Intelligence
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Local Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      langfuse-postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
  minio-data:
  langfuse-postgres-data:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
  model-cache:
